[project]
name = "athenax-partnership-agent"
version = "0.1.0"
description = "AI-Driven Strategic Partnership & Listing Agent for Nouns DAO x AthenaX"
requires-python = ">=3.12"
dependencies = [
    "crewai>=0.80.0",
    "litellm>=1.50.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.9.0",
    "schedule>=1.2.0",
    "python-telegram-bot[job-queue]>=21.0",
    "json-repair>=0.30.0",
]

[project.scripts]
athenax = "athenax.main:main"
athenax-mock = "mock_server.app:run"
athenax-review = "athenax.cli.review:main"
athenax-bot = "telegram_bot.bot:run_bot"
athenax-dashboard = "dashboard.app:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["athenax", "mock_server"]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
]
